<head>
<meta charset="utf-8" />
<title>Manifiesto · Home Redesign</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800;9..144,900&family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:#0b0b0b; color:#111;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Roboto', system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { overflow:hidden; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .sf { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Roboto', system-ui, sans-serif; }
  .sf-display { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Roboto', system-ui, sans-serif; font-feature-settings:"ss01","ss02"; }
  /* shared phone reset */
  .screen { width:100%; height:100%; overflow:hidden; position:relative;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Roboto', system-ui, sans-serif; }
  .nobar { display:none !important; }

  /* animations used across variants */
  @keyframes mf-rise { from { transform: translateY(14px); opacity:0 } to { transform:none; opacity:1 } }
  @keyframes mf-fade { from { opacity:0 } to { opacity:1 } }
  @keyframes mf-float { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-6px) } }
  @keyframes mf-float-slow { 0%,100% { transform:translateY(0) rotate(0deg) } 50% { transform:translateY(-10px) rotate(2deg) } }
  @keyframes mf-bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-3px) } }
  @keyframes mf-breathe { 0%,100% { transform:scale(1) } 50% { transform:scale(1.04) } }
  @keyframes mf-pulse { 0% { box-shadow:0 0 0 0 rgba(58,184,109,0.5)} 100% { box-shadow:0 0 0 14px rgba(58,184,109,0)} }
  @keyframes mf-sparkle { 0%,100% { opacity:.3; transform:scale(0.9) } 50% { opacity:1; transform:scale(1.15) } }
  @keyframes mf-draw { from { stroke-dashoffset: var(--len, 400) } to { stroke-dashoffset:0 } }
  @keyframes mf-slide-in { from { transform: translateX(-10px); opacity:0 } to { transform:none; opacity:1 } }
  @keyframes mf-blink { 0%, 92%, 100% { transform: scaleY(1) } 95% { transform: scaleY(0.1) } }
  @keyframes mf-wiggle { 0%,100% { transform: rotate(-3deg) } 50% { transform: rotate(3deg) } }
  @keyframes mf-shine { 0% { transform: translateX(-120%) } 100% { transform: translateX(220%) } }
  @keyframes mf-grow-bar { from { transform: scaleX(0) } to { transform: scaleX(1) } }
  @keyframes mf-coin-spin { 0%,100% { transform: rotateY(0deg) } 50% { transform: rotateY(180deg) } }
  @keyframes mf-count { from { --n:0 } }
  @keyframes mf-swipe-hint { 0%,100% { transform: translateX(0); opacity:0.5 } 50% { transform: translateX(-4px); opacity:1 } }
  @keyframes mf-pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(15,42,30,0.4) } 100% { box-shadow: 0 0 0 16px rgba(15,42,30,0) } }
  @keyframes mf-day-pop { 0% { transform: scale(0.6); opacity: 0 } 60% { transform: scale(1.08); opacity:1 } 100% { transform: scale(1); opacity:1 } }
  @keyframes mf-sheet-up { from { transform: translateY(100%) } to { transform: translateY(0) } }
  @keyframes mf-fj-ring-paid    { from { stroke-dasharray: 0 9999 } }
  @keyframes mf-fj-ring-pending { from { stroke-dasharray: 0 9999 } }
  @keyframes mf-fj-ring-overdue { from { stroke-dasharray: 0 9999 } }
  @keyframes mf-drop-land { 0% { transform: translateY(-80px) scale(0.3); opacity:0 } 60% { transform: translateY(4px) scale(1.1); opacity:1 } 80% { transform: translateY(-2px) scale(0.96) } 100% { transform: translateY(0) scale(1); opacity:1 } }
  @keyframes mf-drop-ping { 0% { transform: translate(-50%, -50px) scale(0.4); opacity:0 } 40% { transform: translate(-50%, 0) scale(1.15); opacity:1 } 100% { transform: translate(-50%, -14px) scale(1); opacity:1 } }
  @keyframes mf-aurora-a { 0%,100% { transform: translate(0,0) scale(1) } 33% { transform: translate(-20px,30px) scale(1.15) } 66% { transform: translate(15px,-10px) scale(0.92) } }
  @keyframes mf-aurora-b { 0%,100% { transform: translate(0,0) scale(1) } 50% { transform: translate(30px,-20px) scale(1.2) } }
  @keyframes mf-aurora-c { 0%,100% { transform: translate(0,0) scale(1) } 40% { transform: translate(-25px,-15px) scale(1.3) } 80% { transform: translate(20px,10px) scale(0.85) } }
  @keyframes mf-coin-rise { 0% { transform: translateY(0) scale(0.6); opacity:0 } 15% { opacity:1 } 85% { opacity:0.9 } 100% { transform: translateY(-260px) scale(0.3); opacity:0 } }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
