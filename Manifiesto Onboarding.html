<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Manifiesto · Onboarding & Login</title>
<meta name="viewport" content="width=1600" />
<style>
  body { margin:0; background:#F2EEE3; font-family:-apple-system, "SF Pro Display", system-ui, sans-serif; color:#0E3A26; }

  /* Phone wrapper */
  .phone-shell {
    width: 390px;
    height: 844px;
    border-radius: 54px;
    background: #000;
    padding: 12px;
    box-sizing: border-box;
    box-shadow:
      0 0 0 2px #1a1a1a,
      0 30px 60px -30px rgba(15,58,38,0.5),
      0 50px 80px -40px rgba(0,0,0,0.4);
    position: relative;
  }
  .phone-screen {
    width: 100%;
    height: 100%;
    border-radius: 42px;
    overflow: hidden;
    position: relative;
    background: #fff;
  }
  .phone-notch {
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 32px;
    background: #000;
    border-radius: 20px;
    z-index: 100;
  }
  .phone-status {
    position: absolute;
    top: 14px;
    left: 0;
    right: 0;
    z-index: 99;
    display: flex;
    justify-content: space-between;
    padding: 0 32px;
    pointer-events: none;
  }
  .status-time { font-size: 15px; font-weight: 600; }
  .status-icons { display: flex; gap: 5px; align-items: center; }
  .home-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 134px;
    height: 5px;
    border-radius: 3px;
    z-index: 99;
  }
  .scene { padding-top: 44px; height: 100%; box-sizing: border-box; }
  .canvas-bg-light .home-indicator { background: rgba(15,58,38,0.4); }
  .canvas-bg-dark  .home-indicator { background: rgba(255,251,242,0.5); }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="design-canvas.jsx" type="text/babel"></script>
<script src="src/fern.jsx" type="text/babel"></script>
<script src="src/screen-welcome.jsx" type="text/babel"></script>
<script src="src/screen-login.jsx" type="text/babel"></script>
<script src="src/screen-create.jsx" type="text/babel"></script>

<script type="text/babel" data-presets="env,react">

// ─── Phone shell con notch + status bar ─────────────────────
function Phone({ children, statusDark = true }) {
  const statusColor = statusDark ? '#FFFBF2' : '#0E3A26';
  return (
    <div className="phone-shell">
      <div className="phone-screen">
        <div className="phone-notch"></div>
        <div className="phone-status">
          <div className="status-time" style={{ color: statusColor }}>9:41</div>
          <div className="status-icons">
            {/* Signal */}
            <svg width="17" height="11" viewBox="0 0 17 11">
              <rect x="0" y="7" width="3" height="4" rx="0.6" fill={statusColor}/>
              <rect x="4.5" y="5" width="3" height="6" rx="0.6" fill={statusColor}/>
              <rect x="9" y="2.5" width="3" height="8.5" rx="0.6" fill={statusColor}/>
              <rect x="13.5" y="0" width="3" height="11" rx="0.6" fill={statusColor}/>
            </svg>
            {/* Wifi */}
            <svg width="15" height="11" viewBox="0 0 15 11">
              <path d="M7.5 3C9.6 3 11.5 3.8 12.9 5.2L13.9 4.2C12.2 2.5 9.9 1.4 7.5 1.4C5.1 1.4 2.8 2.5 1.1 4.2L2.1 5.2C3.5 3.8 5.4 3 7.5 3Z" fill={statusColor}/>
              <path d="M7.5 6.2C8.7 6.2 9.8 6.7 10.6 7.4L11.6 6.4C10.4 5.3 9 4.6 7.5 4.6C6 4.6 4.6 5.3 3.4 6.4L4.4 7.4C5.2 6.7 6.3 6.2 7.5 6.2Z" fill={statusColor}/>
              <circle cx="7.5" cy="9.4" r="1.3" fill={statusColor}/>
            </svg>
            {/* Battery */}
            <svg width="25" height="12" viewBox="0 0 25 12">
              <rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke={statusColor} strokeOpacity="0.4" fill="none"/>
              <rect x="2" y="2" width="18" height="8" rx="1.5" fill={statusColor}/>
              <path d="M23 4v4c.7-.2 1.3-1 1.3-2s-.6-1.8-1.3-2z" fill={statusColor} fillOpacity="0.4"/>
            </svg>
          </div>
        </div>
        {children}
        <div className="home-indicator"></div>
      </div>
    </div>
  );
}

// ─── Stateful Phone wrappers ────────────────────────────────
function FlowPhone({ initial = 'welcome' }) {
  const [screen, setScreen] = React.useState(initial);
  const isDark = screen === 'welcome';

  return (
    <div className={isDark ? 'canvas-bg-dark' : 'canvas-bg-light'} style={{ height: '100%' }}>
      <Phone statusDark={isDark}>
        <div className="scene">
          {screen === 'welcome' && (
            <WelcomeScreen
              onLogin={() => setScreen('login')}
              onCreate={() => setScreen('create')}
            />
          )}
          {screen === 'login' && (
            <LoginScreen
              onBack={() => setScreen('welcome')}
              onSuccess={() => setScreen('welcome')}
              onSwitchAccount={() => setScreen('welcome')}
            />
          )}
          {screen === 'create' && (
            <CreateAccountScreen
              onBack={() => setScreen('welcome')}
              onComplete={() => setScreen('welcome')}
            />
          )}
        </div>
      </Phone>
    </div>
  );
}

// ─── Logo showcase artboard ────────────────────────────────
function LogoShowcase() {
  return (
    <div style={{
      width: '100%',
      height: '100%',
      background: '#0E3A26',
      borderRadius: '24px',
      overflow: 'hidden',
      position: 'relative',
      display: 'flex',
      flexDirection: 'column',
      padding: '40px',
      gap: '32px',
      color: '#FFFBF2',
    }}>
      {/* Aurora */}
      <div style={{
        position: 'absolute',
        top: '-20%',
        left: '-10%',
        width: '60%',
        height: '60%',
        borderRadius: '50%',
        background: 'radial-gradient(circle, rgba(199,238,156,0.18), transparent 70%)',
        filter: 'blur(50px)',
      }}/>
      <div style={{
        position: 'absolute',
        bottom: '-20%',
        right: '-10%',
        width: '60%',
        height: '60%',
        borderRadius: '50%',
        background: 'radial-gradient(circle, rgba(242,181,138,0.18), transparent 70%)',
        filter: 'blur(50px)',
      }}/>

      {/* Top row — hero logo */}
      <div style={{
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'center',
        gap: '40px',
        flex: 1,
        position: 'relative',
        zIndex: 1,
      }}>
        <Fern size={220} palette="light" animate={true} delay={200}/>
        <div>
          <div style={{
            fontSize: '76px',
            fontWeight: 800,
            letterSpacing: '-3.5px',
            lineHeight: 1,
          }}>
            Manifiesto<span style={{ color: '#F2B58A' }}>.</span>
          </div>
          <div style={{
            marginTop: '14px',
            fontSize: '15px',
            color: 'rgba(255,251,242,0.5)',
            letterSpacing: '2px',
            fontWeight: 600,
            textTransform: 'uppercase',
          }}>
            Logo · Helecho · Final
          </div>
        </div>
      </div>

      {/* Bottom row — variantes */}
      <div style={{
        display: 'flex',
        gap: '14px',
        position: 'relative',
        zIndex: 1,
      }}>
        {[
          { label: 'Mark', bg: 'rgba(255,251,242,0.06)', size: 80, palette: 'light' },
          { label: 'App icon', bg: '#FFFBF2', size: 70, palette: 'dark', radius: 22 },
          { label: 'Mono light', bg: 'transparent', size: 70, palette: 'mono-light' },
          { label: 'Mono dark', bg: '#FFFBF2', size: 70, palette: 'mono-dark', radius: 22 },
        ].map((v, i) => (
          <div key={i} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '10px' }}>
            <div style={{
              width: '110px',
              height: '110px',
              borderRadius: v.radius || 16,
              background: v.bg,
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'center',
              border: v.bg === 'transparent' ? '1px dashed rgba(255,251,242,0.2)' : 'none',
            }}>
              <Fern size={v.size} palette={v.palette} animate={false}/>
            </div>
            <div style={{
              fontSize: '10px',
              fontWeight: 700,
              letterSpacing: '1.5px',
              textTransform: 'uppercase',
              color: 'rgba(255,251,242,0.5)',
            }}>{v.label}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── App ─────────────────────────────────────────────────────
function App() {
  return (
    <DesignCanvas>
      <DCSection
        id="logo"
        title="Logo final · Helecho"
        subtitle="Versión refinada, animada (unfurl + sway), pulso durazno en la espiral."
      >
        <DCArtboard id="showcase" label="Showcase" width={920} height={580}>
          <LogoShowcase/>
        </DCArtboard>
      </DCSection>

      <DCSection
        id="onboarding"
        title="Onboarding · Flujo completo"
        subtitle="3 pantallas interactivas — tocá los botones para navegar adentro de cada teléfono."
      >
        <DCArtboard id="welcome" label="01 · Bienvenida" width={414} height={868}>
          <FlowPhone initial="welcome"/>
        </DCArtboard>

        <DCArtboard id="login" label="02 · Login con Face ID" width={414} height={868}>
          <FlowPhone initial="login"/>
        </DCArtboard>

        <DCArtboard id="create" label="03 · Crear cuenta" width={414} height={868}>
          <FlowPhone initial="create"/>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</body>
</html>
