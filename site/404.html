<!doctype html>
<html lang="es-AR" class="no-js">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#1F590D" />
  <title>404 · Manifiesto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="/assets/styles.css" />
  <link rel="icon" type="image/svg+xml" href="/assets/fern.svg" />
</head>
<body>
  <main style="min-height:100svh;display:grid;place-items:center;background:var(--cream);padding:32px;">
    <div style="max-width:520px;text-align:center;">
      <div class="eyebrow" style="margin-bottom:24px;">404 · página no encontrada</div>
      <h1 style="font-family:var(--font-display);font-weight:400;font-size:clamp(40px,6vw,72px);line-height:1;letter-spacing:-0.03em;margin:0 0 18px;">
        Por acá no <em style="font-style:italic;color:var(--brand-strong);">hay nada</em>.
      </h1>
      <p style="color:var(--text-muted);font-size:17px;line-height:1.55;margin:0 0 32px;">
        El link que abriste no existe o se movió. Volvé al inicio o
        chequeá los documentos legales.
      </p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
        <a class="cta" style="background:var(--ink-900);color:var(--cream);" href="/">Volver al inicio</a>
        <a class="cta cta--ghost" style="--fg:var(--text-ink);border-color:var(--line-strong);" href="/privacy/">Política de privacidad</a>
        <a class="cta cta--ghost" style="--fg:var(--text-ink);border-color:var(--line-strong);" href="/terms/">Términos</a>
      </div>
    </div>
  </main>
</body>
</html>
