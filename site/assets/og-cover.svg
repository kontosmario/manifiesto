<?xml version="1.0" encoding="UTF-8"?>
<!--
  Open Graph cover for Manifiesto. 1200×630 (the Facebook/Twitter
  standard). Dark welcomeBg with peach + soft-green aurora and the
  fern + wordmark as the centerpiece. Static — no JS, no fonts
  required (uses generic serif/sans-serif which all crawlers
  rasterise consistently).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="auroraPeach" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#F2B58A" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#F2B58A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraGreen" cx="78%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#A6EF8F" stop-opacity="0.35"/>
      <stop offset="65%" stop-color="#A6EF8F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E3A26"/>
      <stop offset="100%" stop-color="#08221A"/>
    </linearGradient>
    <radialGradient id="fernHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A6EF8F" stop-opacity="0.30"/>
      <stop offset="70%" stop-color="#A6EF8F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  <rect width="1200" height="630" fill="url(#auroraPeach)"/>
  <rect width="1200" height="630" fill="url(#auroraGreen)"/>

  <!-- Fern halo -->
  <circle cx="300" cy="270" r="180" fill="url(#fernHalo)"/>

  <!-- Manifiesto fern · canonical artwork, positioned left-center -->
  <g transform="translate(170, 130)">
