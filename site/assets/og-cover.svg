      </g>
    </svg>
  </g>

  <!-- Wordmark + tagline · right of fern -->
  <g fill="#FFFBF2" font-family="Georgia, 'Iowan Old Style', serif">
    <text x="500" y="290" font-size="120" font-weight="400" letter-spacing="-5">Manifiesto<tspan fill="#F2B58A">.</tspan></text>
    <text x="500" y="360" font-size="32" font-style="italic" fill="rgba(255,251,242,0.72)" letter-spacing="-0.5">Finanzas para tu familia.</text>
  </g>

  <!-- URL footer -->
  <g font-family="ui-monospace, 'SF Mono', monospace" fill="rgba(255,251,242,0.5)" font-size="18" letter-spacing="2">
    <text x="500" y="500">MANIFIESTO.APP</text>
    <line x1="500" y1="520" x2="700" y2="520" stroke="#F2B58A" stroke-width="1" opacity="0.6"/>
  </g>
</svg>
