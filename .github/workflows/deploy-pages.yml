name: Deploy GitHub Pages

# Publishes the static site under `site/` to GitHub Pages.
# Trigger: push to main that touches site contents, or manual dispatch.
#
# Setup (one-time, in repo Settings → Pages):
#   - Source: "GitHub Actions"
#   - Custom domain: manifiesto.app (the CNAME file at site/CNAME
#     declares this so GH Pages applies it automatically).

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# Permissions required by actions/deploy-pages@v4.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deploy at a time; queue the next push but don't
# cancel an in-flight one (we don't want a half-published site).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Only ship the `site/` folder — keeps the artifact small
          # and excludes everything else in the repo (mobile/, docs/,
          # node_modules, etc.).
          path: ./site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
