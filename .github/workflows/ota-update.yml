name: OTA Update (EAS Update)

# Sprint C / C7 — OTA pipeline.
#
# Ships a JS / asset bundle to the `production` EAS Update channel on every
# push to `main`, *unless* the diff touches native code. Native changes
# require a new TestFlight build (see `release.yml`) — pushing them via
# OTA would silently break runtime version matching and we'd serve a
# bundle no installed binary can load.
#
# Native-skip detection: any change under `ios/`, `android/`, `app.config.ts`,
# `eas.json`, or `package.json` / `package-lock.json` (which may pull in
# new native deps) triggers a no-op. The owner cuts a new tag instead.
#
# Required secrets:
#   - EXPO_UPDATE_TOKEN : Expo access token scoped to `Update` only
#                  (G-Infra2, red team audit 2026-06-10). Separating it
#                  from the release pipeline's token means a leak from
#                  here cannot trigger a new TestFlight build (and vice
#                  versa). If unset, falls back to EXPO_TOKEN for
#                  backwards compatibility. Generate at
#                  https://expo.dev/settings/access-tokens.
#   - EXPO_TOKEN : (Legacy) broad-scope Expo token. Fallback only;
#                  prefer EXPO_UPDATE_TOKEN going forward.
#   - EXPO_UPDATE_PRIVATE_KEY : PEM-encoded RSA-2048 private key matching
#                  the cert bundled in the app (certs/certificate.pem),
#                  used with the `rsa-v1_5-sha256` suite declared in
#                  app.config.ts.
#                  Sprint F · F1 — code signing for OTA bundles, see
#                  docs/operaciones/runbook-release-automation.md. Without
#                  it the `eas update` step fails — we never silently ship
#                  an unsigned bundle to clients that expect a signature.
#
# Manual fallback: `workflow_dispatch` lets the owner force-publish on
# demand (e.g. to roll out a hotfix from a release branch).

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: 'EAS Update branch (channel)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
      message:
        description: 'Update message (defaults to commit subject)'
        required: false
        type: string

# Infra H-2 (red team audit 2026-06-10): minimum GITHUB_TOKEN scope. EAS
# Update authenticates via EXPO_TOKEN; nothing here writes to the repo.
permissions:
  contents: read

# Sprint J · J-Infra1 — serializar publishes a la misma branch para que
# dos runs en paralelo (push a main + workflow_dispatch lanzado por el
# owner, o dos merges back-to-back) no llamen a `eas update` al mismo
# tiempo. El último PUT al manifest store gana silenciosamente; con
# `cancel-in-progress: false` el segundo run espera al primero en vez
# de cancelarlo (no queremos perder un publish ya empezado).
concurrency:
  group: ota-update-${{ github.event.inputs.branch || 'production' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Need at least 2 commits so `paths-filter` can diff against the
          # previous commit. `fetch-depth: 0` is safer on force-push edge
          # cases but slower; 2 covers the normal case.
          fetch-depth: 2

      - name: Detect native changes
        id: filter
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          # Don't skip just because a doc-only commit happens to touch
          # package.json (lockfile bumps from `npm install` count as
          # native risk — too easy for a new native dep to sneak in).
          filters: |
            native:
              - 'ios/**'
              - 'android/**'
              - 'app.config.ts'
              - 'app.json'
              - 'eas.json'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ota-update.yml'

      - name: Skip notice (native change detected)
        if: steps.filter.outputs.native == 'true' && github.event_name == 'push'
        run: |
          echo "::notice::Native / config change detected — skipping OTA. Cut a tag (vX.Y.Z) to ship a new TestFlight build."

      - name: Setup Node
        if: steps.filter.outputs.native != 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup EAS
        # G-Infra2 (red team audit 2026-06-10): prefer the scoped
        # EXPO_UPDATE_TOKEN (Update perms only) so a token leak from
        # the OTA pipeline cannot trigger a new TestFlight build /
        # submit. Falls back to EXPO_TOKEN for backwards compatibility
        # during the rollout window.
        if: steps.filter.outputs.native != 'true' || github.event_name == 'workflow_dispatch'
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_UPDATE_TOKEN || secrets.EXPO_TOKEN }}

      - name: Install
        if: steps.filter.outputs.native != 'true' || github.event_name == 'workflow_dispatch'
        run: npm ci

      - name: Resolve branch + message
        if: steps.filter.outputs.native != 'true' || github.event_name == 'workflow_dispatch'
        id: meta
        env:
          INPUT_BRANCH: ${{ github.event.inputs.branch }}
          INPUT_MESSAGE: ${{ github.event.inputs.message }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          BRANCH="${INPUT_BRANCH:-production}"
          # Default message: first line of the head commit. Fallback to
          # the SHA for dispatch runs with no commit context.
          MSG="${INPUT_MESSAGE}"
          if [ -z "$MSG" ]; then
            MSG="$(echo "$COMMIT_MSG" | head -n1)"
          fi
          if [ -z "$MSG" ]; then
            MSG="OTA ${GITHUB_SHA::7}"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "message=$MSG" >> "$GITHUB_OUTPUT"

      # Sprint F · F1 — write the code-signing private key to a runner-local
      # file that only the EAS Update step reads. We never commit the key
      # nor expose it in logs (the heredoc avoids `echo` showing the value
      # if `set -x` ever gets enabled). The cleanup step below removes the
      # file even on failure, so a cached runner can never leak it.
      - name: Write OTA signing key
        if: steps.filter.outputs.native != 'true' || github.event_name == 'workflow_dispatch'
        env:
          PRIVATE_KEY: ${{ secrets.EXPO_UPDATE_PRIVATE_KEY }}
        run: |
          if [ -z "$PRIVATE_KEY" ]; then
            echo "::error::EXPO_UPDATE_PRIVATE_KEY secret is empty. Owner must add it (see docs/operaciones/runbook-release-automation.md → EAS Update code signing)."
            exit 1
          fi
          install -m 600 /dev/null "$RUNNER_TEMP/private-key.pem"
          printf '%s' "$PRIVATE_KEY" > "$RUNNER_TEMP/private-key.pem"
          # Sanity check the file looks like a PEM key without printing its
          # contents — `head -n1` shows only the BEGIN line.
          head -n1 "$RUNNER_TEMP/private-key.pem" | grep -q "BEGIN" || {
            echo "::error::EXPO_UPDATE_PRIVATE_KEY does not look like a PEM key."
            exit 1
          }

      # Sprint O · Audit #8 O-4 (2026-06-14): cert↔private-key fingerprint
      # check. If the owner rotates `certs/certificate.pem` in the repo
      # but forgets to rotate `EXPO_UPDATE_PRIVATE_KEY` in GitHub Secrets
      # (or vice-versa), `eas update` happily signs the bundle with the
      # wrong key — every installed client SILENTLY rejects the OTA. OTA
      # goes dead with zero warning. This step makes the divergence loud
      # at CI time: extract the public key from the cert, derive the
      # public key from the private key, compare. They must match.
      - name: Verify cert matches private key
        if: steps.filter.outputs.native != 'true' || github.event_name == 'workflow_dispatch'
        run: |
          if [ ! -f certs/certificate.pem ]; then
            echo "::error::certs/certificate.pem is missing — cannot verify cert/key match."
            exit 1
          fi
          CERT_PUB=$(openssl x509 -in certs/certificate.pem -pubkey -noout 2>/dev/null)
          KEY_PUB=$(openssl rsa -in "$RUNNER_TEMP/private-key.pem" -pubout 2>/dev/null)
          if [ -z "$CERT_PUB" ] || [ -z "$KEY_PUB" ]; then
            echo "::error::Failed to extract public key from cert or private key."
            exit 1
          fi
          if [ "$CERT_PUB" != "$KEY_PUB" ]; then
            echo "::error::EXPO_UPDATE_PRIVATE_KEY does not match certs/certificate.pem. Installed clients will reject the OTA. Rotate one to match the other."
            exit 1
          fi
          echo "Cert and private key match — OTA signature will validate."

      - name: EAS Update
        if: steps.filter.outputs.native != 'true' || github.event_name == 'workflow_dispatch'
        env:
          # expo-updates reads this env var to sign the manifest before
          # uploading. Path is runner-local (cleaned up below).
          EXPO_UPDATES_PRIVATE_KEY_PATH: ${{ runner.temp }}/private-key.pem
          # Sprint J · J-Infra2 — pasar BRANCH/MESSAGE vía env evita
          # command-injection si el commit subject (o el input manual de
          # workflow_dispatch) contiene comillas/backticks/$. La
          # substitución `${{ ... }}` ocurre ANTES del shell parsing, así
          # que un message con `"` cerraría el quote del comando expandido.
          # Misma defensa que aplicamos en release.yml (Sprint C #6).
          BRANCH: ${{ steps.meta.outputs.branch }}
          MESSAGE: ${{ steps.meta.outputs.message }}
        run: |
          eas update \
            --branch "$BRANCH" \
            --message "$MESSAGE" \
            --private-key-path "$EXPO_UPDATES_PRIVATE_KEY_PATH" \
            --non-interactive

      - name: Cleanup signing key
        if: always()
        run: |
          # Always wipe the key, even on failure / cancellation. GitHub
          # runners are ephemeral but defence in depth: a flaky shared
          # runner or post-step plugin could otherwise read the file.
          rm -f "$RUNNER_TEMP/private-key.pem" || true
