name: Mobile CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Infra H-2 (red team audit 2026-06-10): tighten GITHUB_TOKEN scope at the
# workflow level. Default is read/write contents — none of these jobs need
# write access. Per-job overrides below only widen where strictly required.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Steps below use `if: always()` so a single early failure
      # doesn't hide downstream failures — devs get the full picture
      # in one CI run instead of fixing-pushing-fixing-pushing.
      # Install must succeed (no point running tests without deps);
      # everything after is independent enough to surface in parallel.
      - name: Lint
        if: always()
        run: npm run lint

      - name: Typecheck
        if: always()
        run: npm run typecheck

      - name: Unit tests
        if: always()
        run: npm test

      - name: Guard — legacy spacing
        if: always()
        run: npm run guard:legacy-spacing

      - name: Guard — forbidden copy
        if: always()
        run: npm run guard:forbidden-copy

      - name: Guard — motion tokens
        if: always()
        run: npm run guard:motion-tokens

      - name: Guard — font scale
        if: always()
        run: npm run guard:font-scale

      - name: Bundle iOS (regression guard)
        if: always()
        run: npx expo export --platform ios --output-dir /tmp/expo-export --dump-sourcemap=false

      - name: Setup Deno
        if: always()
        uses: denoland/setup-deno@11b63cf76cfcafb4e43f97b6cad24d8e8438f62d # v1.5.2
        with:
          deno-version: v2.x

      - name: Edge function smoke tests
        if: always()
        working-directory: supabase/functions
        run: |
          deno test --allow-env --allow-net send-family-push notifications-orchestrator

  # Integration tests run against a real local Supabase stack (Postgres + GoTrue +
  # PostgREST) spun up via `supabase start`. The stack applies every migration
  # under `supabase/migrations/`, so this job catches RLS regressions, RPC
  # signature drift, and trigger bugs that unit tests can't see.
  #
  # Gated by a paths filter: only runs when backend, integration tests, the
  # workflow itself, or shared mobile data layer changes — keeps CI fast on
  # pure UI PRs. Boot takes ~2–3 min; suite ~30 s; total well under 10 min.
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Re-run on push to main even if the paths filter didn't match the diff —
    # protects main against drift between merges that individually skipped this job.
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: latest

      - name: Install
        run: npm ci

      - name: Start Supabase (db + auth + rest only)
        # We don't need studio, inbucket, realtime, edge runtime, storage,
        # imgproxy, or the pooler for these tests — excluding them shaves
        # ~60 s off boot and avoids pulling images we never query.
        run: |
          supabase start \
            --exclude studio,inbucket,imgproxy,edge-runtime,storage-api,realtime,pooler,vector

      - name: Export Supabase keys
        # `setup-cli` writes status to a known location. We read the local
        # well-known JWTs out of `supabase status` so the test helpers don't
        # have to shell out to npx supabase inside vitest forks.
        run: |
          status_json=$(supabase status -o json)
          echo "SUPABASE_URL=$(echo "$status_json" | jq -r .API_URL)" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$(echo "$status_json" | jq -r .ANON_KEY)" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$status_json" | jq -r .SERVICE_ROLE_KEY)" >> "$GITHUB_ENV"

      - name: Integration tests
        run: npm run test:integration

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true

  # Integration tests on PRs — only runs when the diff touches code that could
  # plausibly break the backend contract. Keeps UI-only PRs fast (skips ~3 min
  # of stack boot) while still gating risky changes.
  integration-tests-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: |
            backend:
              - 'supabase/migrations/**'
              - 'supabase/functions/**'
              - 'tests/integration/**'
              - 'mobile/data/**'
              - 'mobile/features/**/data/**'
              - 'vitest.integration.config.ts'
              - '.github/workflows/mobile-ci.yml'
              - 'package.json'
              - 'package-lock.json'

      - name: Setup Node
        if: steps.filter.outputs.backend == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Supabase CLI
        if: steps.filter.outputs.backend == 'true'
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: latest

      - name: Install
        if: steps.filter.outputs.backend == 'true'
        run: npm ci

      - name: Start Supabase (db + auth + rest only)
        if: steps.filter.outputs.backend == 'true'
        run: |
          supabase start \
            --exclude studio,inbucket,imgproxy,edge-runtime,storage-api,realtime,pooler,vector

      - name: Export Supabase keys
        if: steps.filter.outputs.backend == 'true'
        run: |
          status_json=$(supabase status -o json)
          echo "SUPABASE_URL=$(echo "$status_json" | jq -r .API_URL)" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$(echo "$status_json" | jq -r .ANON_KEY)" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$status_json" | jq -r .SERVICE_ROLE_KEY)" >> "$GITHUB_ENV"

      - name: Integration tests
        if: steps.filter.outputs.backend == 'true'
        run: npm run test:integration

      - name: Skip notice
        if: steps.filter.outputs.backend != 'true'
        run: echo "No backend/integration-relevant changes — skipping integration suite."

      - name: Stop Supabase
        if: always() && steps.filter.outputs.backend == 'true'
        run: supabase stop --no-backup || true

  # gitleaks — secret scanning. Custom ruleset at `.gitleaks.toml` adds
  # Supabase JWT (anon + service_role), `sb_secret_*` / `sb_publishable_*`
  # prefixes, and Expo access tokens on top of the default ruleset.
  # Fails the job on any unexpected match so leaked credentials never land
  # on `main`. See `docs/operaciones/runbook-backend-hardening.md` for the
  # response playbook when a leak is caught.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history so gitleaks scans every commit on PRs and on push.
          # `0` is required for the action's `git log` traversal.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Surface scanned secrets only in the action log, not the PR
          # comment — redacted output keeps incident response auditable
          # without leaking the value a second time.
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_NOTIFY_USER_LIST: ''

  # E2E — Playwright smoke tests against the Expo web export. Sprint C / C3.
  #
  # Strategy: instead of booting the Expo dev server inside CI (slow, flaky
  # under cold Metro), we build the web export once with `expo export
  # --platform web`, serve the static output, and point Playwright at it.
  # This matches what users get in prod for the web bundle and dramatically
  # cuts the boot time vs `expo start --web`.
  #
  # Trigger: only on `push` to main + manual dispatch. PRs skip this job
  # to keep PR CI snappy — the smoke suite is mostly a "did the bundle
  # boot without runtime errors" check, and the bundle step in `verify`
  # already catches build regressions.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browsers
        # Only chromium — we don't run cross-browser yet. `--with-deps`
        # pulls the system libs (libnss3, libxkbcommon, etc) Playwright
        # needs on ubuntu-latest.
        run: npx playwright install --with-deps chromium

      - name: Build Expo web export
        # Static output lands in `dist/`. We don't dump sourcemaps in CI
        # — the smoke tests only assert on runtime behavior, not symbol
        # resolution.
        run: npx expo export --platform web --output-dir dist --dump-sourcemap=false

      - name: Serve static bundle
        # `npx serve` on port 8081 matches the `baseURL` in
        # `playwright.config.ts`. `--single` rewrites unknown routes to
        # `index.html` so the expo-router client-side router can handle
        # them (otherwise `/login`, `/home` etc 404 on hard reload).
        # Run in background; the next step polls for readiness.
        run: |
          npx serve dist --listen 8081 --single &
          echo "SERVE_PID=$!" >> "$GITHUB_ENV"
          # Wait for the server to actually accept connections before
          # handing off to Playwright. `serve` boots in <2s typically,
          # but CI runners are noisy.
          for i in {1..30}; do
            if curl -sf http://localhost:8081 >/dev/null; then
              echo "Static server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Static server failed to come up after 30s"
          exit 1

      - name: Run Playwright tests
        # `reuseExistingServer: true` in `playwright.config.ts` means
        # Playwright will pick up the already-running `serve` process
        # rather than booting `expo start --web` itself.
        env:
          CI: '1'
          PLAYWRIGHT_BASE_URL: http://localhost:8081
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop static server
        if: always()
        run: |
          if [ -n "${SERVE_PID:-}" ]; then
            kill "$SERVE_PID" 2>/dev/null || true
          fi
